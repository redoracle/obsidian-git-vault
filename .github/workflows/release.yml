name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.repository == 'redoracle/obsidian-git-vault'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess

      - name: Run tests
        run: pnpm test

      - name: Verify types, lint, format and production advisories
        run: |
          pnpm run tsc
          pnpm run svelte
          pnpm run lint
          pnpm run format
          pnpm audit --prod --audit-level high

      - name: Verify release preparation and release-notes generator
        run: |
          test -x scripts/prepare-release.sh
          bash -n scripts/prepare-release.sh
          pnpm run test:release-notes
          pnpm run test:release-metadata

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Sync release metadata atomically
        if: success()
        run: bash scripts/sync-release-metadata.sh
