name: Temporary second-wave Dependabot migration

on:
  push:
    branches:
      - fix/dependabot-next-wave-2026-11-05

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.repository == 'redoracle/obsidian-git-vault'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile for two major upgrades
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Install verified graph
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
      - name: Format with Svelte Prettier v4
        run: pnpm exec prettier --write src
      - name: Verify source compatibility and production bundle
        run: |
          pnpm run tsc
          pnpm run svelte
          pnpm run lint
          pnpm run format
          pnpm run test
          pnpm run build
      - name: Verify production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Save verified lockfile and generated formatting
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml src
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): record verified Svelte formatter and SHA-256 migration'
          git push origin HEAD:fix/dependabot-next-wave-2026-11-05
