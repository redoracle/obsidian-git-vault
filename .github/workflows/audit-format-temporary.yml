name: Temporary audit formatting pass

on:
  push:
    branches:
      - audit/enterprise-flow-control-2026-11-06

permissions:
  contents: write

jobs:
  apply-prettier:
    if: github.repository == 'redoracle/obsidian-git-vault'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
      - name: Apply repository Prettier configuration
        run: pnpm exec prettier --write src
      - name: Commit deterministic source formatting
        run: |
          set -euo pipefail
          git add src
          if git diff --cached --quiet; then
            echo "Source already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply verified source formatting after flow control hardening'
          git push origin HEAD:audit/enterprise-flow-control-2026-11-06
