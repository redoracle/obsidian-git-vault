name: Temporary Dependabot reconciliation lockfile refresh

on:
  push:
    branches:
      - fix/dependabot-hygiene-2026-11-05

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.repository == 'redoracle/obsidian-git-vault'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve root lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Resolve independent screenshot lockfile
        working-directory: screenshots
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify frozen root lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
      - name: Apply Prettier 3.9 source formatting
        run: pnpm exec prettier --write src
      - name: Verify root quality gates
        run: |
          pnpm run tsc
          pnpm run svelte
          pnpm run lint
          pnpm run format
          pnpm run test
          pnpm run build
      - name: Check production dependency security
        run: pnpm audit --prod --audit-level high
      - name: Commit verified dependency lockfiles
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml screenshots/package-lock.json src
          if git diff --cached --quiet; then
            echo 'Lockfiles already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): align verified root and screenshot lockfiles'
          git push origin HEAD:fix/dependabot-hygiene-2026-11-05
