name: Temporary audited dependency lockfile refresh

on:
  push:
    branches:
      - audit/architecture-security-second-pass-2026-11-05

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'redoracle/obsidian-git-vault'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Resolve patched Git libraries
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Refresh compatible dependencies within declared ranges
        run: pnpm update --ignore-scripts
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
      - name: Format new and touched TypeScript files
        run: |
          pnpm exec prettier --write src/utils.ts src/security/logRedaction.ts src/syncProvider/syncAuditLog.ts src/setting/infra/githubApiClient.ts src/setting/infra/githubPagination.ts src/gitManager/simpleGit.ts src/gitManager/gitEnvironment.ts src/setting/infra/gitlabApiClient.ts src/setting/infra/giteaApiClient.ts tests/unit/gitEnvironment.test.ts tests/unit/syncAuditLog.test.ts tests/unit/logRedaction.test.ts tests/unit/githubApiClient.test.ts tests/unit/githubPagination.test.ts
      - name: Verify upgraded dependencies
        run: |
          pnpm run tsc
          pnpm run svelte
          pnpm run lint
          pnpm run format
          pnpm run test
          pnpm run build
      - name: Audit production dependency vulnerabilities
        run: pnpm audit --prod --audit-level high
      - name: Commit lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml src/gitManager/gitEnvironment.ts src/setting/infra/gitlabApiClient.ts src/setting/infra/giteaApiClient.ts tests/unit/gitEnvironment.test.ts src/utils.ts src/security/logRedaction.ts src/syncProvider/syncAuditLog.ts src/setting/infra/githubApiClient.ts src/setting/infra/githubPagination.ts src/gitManager/simpleGit.ts tests/unit/syncAuditLog.test.ts tests/unit/logRedaction.test.ts tests/unit/githubApiClient.test.ts tests/unit/githubPagination.test.ts
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'chore(deps): record verified patched Git modules and formatting'
          git push origin HEAD:audit/architecture-security-second-pass-2026-11-05
