name: test

permissions:
    contents: read

on:
    workflow_dispatch:
    push:
    pull_request:
jobs:
    svelte-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.9
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install modules
              run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
            - name: Run Svelte-Check
              run: pnpm run svelte
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.9
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install modules
              run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
            - name: Run ESLint
              run: pnpm run lint
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.9
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install modules
              run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
            - name: Run Prettier
              run: pnpm run format
    compile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.9
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install modules
              run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
            - name: Run tsc
              run: pnpm run tsc --noEmit
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.9
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install modules
              run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
            - name: Run build
              run: pnpm run build
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.9
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install modules
              run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild esbuild svelte-preprocess
            - name: Run unit and integration tests
              run: pnpm run test
            - name: Verify release preparation and release-notes compatibility
              run: |
                  test -x scripts/prepare-release.sh
                  bash -n scripts/prepare-release.sh
                  pnpm run test:release-notes
                  pnpm run test:release-metadata
    dependency-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.9
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: Audit production dependencies for high and critical advisories
              run: pnpm audit --prod --audit-level high
    screenshot-harness:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: screenshots/package-lock.json
            - name: Install isolated screenshot-harness dependencies
              working-directory: screenshots
              run: npm ci --ignore-scripts
            - name: Audit screenshot development dependencies
              working-directory: screenshots
              run: npm audit --audit-level high
            - name: Type-check screenshot generator
              working-directory: screenshots
              run: npm run typecheck
            - name: Install Chromium for deterministic screenshot tests
              working-directory: screenshots
              run: npx playwright install --with-deps chromium
            - name: Exercise screenshot scenarios
              working-directory: screenshots
              run: npm test
